[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-analytics"
version = "0.2.0"
description = "Fuzzy logic analytics for trading, marketing and shareholder value"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=2.0"]
authors = [{ name = "Sam Burwood" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
